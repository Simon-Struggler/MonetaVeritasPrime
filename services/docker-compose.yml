services:
  auth:
    build: ./auth
    container_name: auth_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./auth.db
      - SECRET_KEY=${SECRET_KEY}
      - DOCKER=true
    volumes:
      - ./auth:/app
      - auth_data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  catalog:
    build: ./catalog
    container_name: catalog_service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=sqlite:///./catalog.db
      - SECRET_KEY=${SECRET_KEY}
      - AUTH_SERVICE_URL=http://auth:8001
      - DOCKER=true
    volumes:
      - ./catalog:/app
      - catalog_data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    networks:
      - microservices_net
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  collections:
    build: ./collections
    container_name: collections_service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=sqlite:///./collections.db
      - SECRET_KEY=${SECRET_KEY}
      - CATALOG_SERVICE_URL=http://catalog:8002
      - DOCKER=true
    volumes:
      - ./collections:/app
      - collections_data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload
    networks:
      - microservices_net
    depends_on:
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  auction:
    build: ./auction
    container_name: auction_service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=sqlite:///./auction.db
      - SECRET_KEY=${SECRET_KEY}
      - AUTH_SERVICE_URL=http://auth:8001
      - DOCKER=true
    volumes:
      - ./auction:/app
      - auction_data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8005 --reload
    networks:
      - microservices_net
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build: ./gateway
    container_name: api_gateway
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - AUTH_SERVICE_URL=http://auth:8001
      - CATALOG_SERVICE_URL=http://catalog:8002
      - COLLECTIONS_SERVICE_URL=http://collections:8003
      - AUCTION_SERVICE_URL=http://auction:8005
      - DOCKER=true
    volumes:
      - ./gateway:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - microservices_net
    depends_on:
      - auth
      - catalog
      - collections
      - auction
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  microservices_net:
    driver: bridge

volumes:
  auth_data:
  catalog_data:
  collections_data:
  auction_data: