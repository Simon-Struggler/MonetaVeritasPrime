<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MonetaVeritas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-collector fixed-top">
        <div class="container">
            <a class="navbar-brand logo-hover" href="/">MonetaVeritas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link nav-collector" href="/catalog">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-collector" href="/collections">Коллекция</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-collector" href="/exchange">Обмен</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    {% if request.cookies.get('token') %}
                        <li class="nav-item">
                            <a class="nav-link nav-collector" href="/logout">Выход</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link nav-collector" href="#" onclick="openLoginModal(); return false;">Вход</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-collector" href="#" onclick="openRegisterModal(); return false;">Регистрация</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer-collector mt-5">
        <div class="container text-center">
            <p>&copy; 2026 MonetaVeritas. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header bg-collector text-white border-bottom-0">
                    <h5 class="modal-title" id="authModalLabel">Вход</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body bg-cream">
                    <div class="btn-group w-100 mb-4" role="group" aria-label="Auth type">
                        <button type="button" class="btn btn-gold" id="loginTabBtn" onclick="showAuthTab('login')">Вход</button>
                        <button type="button" class="btn btn-outline-gold" id="registerTabBtn" onclick="showAuthTab('register')">Регистрация</button>
                    </div>
                    <div id="authAlert" class="alert d-none" role="alert"></div>

                    <form id="loginForm" class="auth-form" onsubmit="submitLogin(event)">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" id="loginUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100">Войти</button>
                    </form>

                    <form id="registerForm" class="auth-form d-none" onsubmit="submitRegister(event)">
                        <div class="mb-3">
                            <label for="registerUsername" class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" id="registerUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="registerEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="registerPassword" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100">Зарегистрироваться</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
    const authModal = new bootstrap.Modal(document.getElementById('authModal'));
    function showAuthTab(tab) {
        const loginTab = document.getElementById('loginTabBtn');
        const registerTab = document.getElementById('registerTabBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const title = document.getElementById('authModalLabel');
        const alertBox = document.getElementById('authAlert');

        alertBox.classList.add('d-none');
        if (tab === 'register') {
            loginForm.classList.add('d-none');
            registerForm.classList.remove('d-none');
            loginTab.classList.remove('btn-gold');
            loginTab.classList.add('btn-outline-gold');
            registerTab.classList.add('btn-gold');
            registerTab.classList.remove('btn-outline-gold');
            title.textContent = 'Регистрация';
        } else {
            loginForm.classList.remove('d-none');
            registerForm.classList.add('d-none');
            loginTab.classList.add('btn-gold');
            loginTab.classList.remove('btn-outline-gold');
            registerTab.classList.remove('btn-gold');
            registerTab.classList.add('btn-outline-gold');
            title.textContent = 'Вход';
        }
    }

    function openLoginModal() {
        showAuthTab('login');
        authModal.show();
    }

    function openRegisterModal() {
        showAuthTab('register');
        authModal.show();
    }

    function showAuthMessage(message, type = 'success') {
        const alertBox = document.getElementById('authAlert');
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
        alertBox.classList.remove('d-none');
    }

    async function submitLogin(event) {
        event.preventDefault();
        const payload = {
            username: document.getElementById('loginUsername').value,
            password: document.getElementById('loginPassword').value,
        };
        try {
            const resp = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                credentials: 'same-origin',
            });
            const data = await resp.json();
            if (!resp.ok) {
                showAuthMessage(data.detail || data.error || 'Ошибка входа', 'danger');
                return;
            }
            showAuthMessage('Успешный вход. Страница будет обновлена.', 'success');
            setTimeout(() => window.location.reload(), 800);
        } catch (error) {
            showAuthMessage('Ошибка соединения. Попробуйте позже.', 'danger');
        }
    }

    async function submitRegister(event) {
        event.preventDefault();
        const payload = {
            username: document.getElementById('registerUsername').value,
            email: document.getElementById('registerEmail').value,
            password: document.getElementById('registerPassword').value,
        };
        try {
            const resp = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                credentials: 'same-origin',
            });
            const data = await resp.json();
            if (!resp.ok) {
                showAuthMessage(data.detail || data.error || 'Ошибка регистрации', 'danger');
                return;
            }
            showAuthMessage('Регистрация прошла успешно. Войдите в систему.', 'success');
            showAuthTab('login');
        } catch (error) {
            showAuthMessage('Ошибка соединения. Попробуйте позже.', 'danger');
        }
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
