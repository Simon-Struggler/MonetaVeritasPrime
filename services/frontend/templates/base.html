<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MonetaVeritas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-collector fixed-top">
        <div class="container">
            <a class="navbar-brand logo-hover" href="/">MonetaVeritas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link nav-collector" href="/catalog">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-collector" href="/collections">Коллекция</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-collector" href="/exchange">Обмен</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    {% if request.cookies.get('token') %}
                        <li class="nav-item">
                            <a class="nav-link nav-collector" href="/logout">Выход</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link nav-collector" href="/login">Вход</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer-collector mt-5">
        <div class="container text-center">
            <p>&copy; 2026 MonetaVeritas. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
