<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MonetaVeritas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
    <style>
        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .nav-collector i {
            margin-right: 6px;
        }
        .nav-collector:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body data-user-authenticated="{{ 'true' if username else 'false' }}">
    <nav class="navbar navbar-expand-lg navbar-dark bg-collector fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">MonetaVeritas</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link nav-collector {% if request.url.path == '/catalog' %}active{% endif %}"
                           href="#" data-auth-required="true" data-url="/catalog">
                            <i class="bi bi-book"></i> Каталог
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-collector {% if request.url.path == '/collections' %}active{% endif %}"
                           href="#" data-auth-required="true" data-url="/collections">
                            <i class="bi bi-folder2-open"></i> Коллекция
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-collector {% if request.url.path == '/exchange' %}active{% endif %}"
                           href="#" data-auth-required="true" data-url="/exchange">
                            <i class="bi bi-arrow-left-right"></i> Обмен
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    {% if username %}
                        <li class="nav-item">
                            <span class="navbar-text">
                                <i class="bi bi-person-circle"></i> {{ username }}
                            </span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-collector" href="/logout">
                                <i class="bi bi-box-arrow-right"></i> Выход
                            </a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link nav-collector" href="#" onclick="openAuth('login'); return false;">
                                <i class="bi bi-box-arrow-in-right"></i> Вход
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-collector" href="#" onclick="openAuth('register'); return false;">
                                <i class="bi bi-person-plus"></i> Регистрация
                            </a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container py-4">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer-collector mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 MonetaVeritas — Коллекционируйте с удовольствием</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Модальное окно авторизации -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content shadow-lg">
                <div class="modal-header">
                    <h5 class="modal-title" id="authModalLabel">Вход</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="btn-group w-100 mb-3" role="group">
                        <button type="button" class="btn btn-sm" id="loginTabBtn" onclick="showAuthTab('login')">Вход</button>
                        <button type="button" class="btn btn-sm" id="registerTabBtn" onclick="showAuthTab('register')">Регистрация</button>
                    </div>
                    <div id="authAlert" class="alert d-none py-2 small" role="alert"></div>

                    <form id="loginForm" onsubmit="submitLogin(event)">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="loginUsername" placeholder="Имя пользователя" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" id="loginPassword" placeholder="Пароль" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100">Войти</button>
                    </form>

                    <form id="registerForm" class="d-none" onsubmit="submitRegister(event)">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="registerUsername" placeholder="Имя пользователя" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" id="registerEmail" placeholder="Email" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" id="registerPassword" placeholder="Пароль" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100">Зарегистрироваться</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Получаем состояние авторизации из data-атрибута body
        const bodyElement = document.body;
        const isAuthenticated = bodyElement.getAttribute('data-user-authenticated') === 'true';

        const authModal = new bootstrap.Modal(document.getElementById('authModal'));
        let pendingRedirect = null;

        function openAuth(tab, redirectUrl = null) {
            showAuthTab(tab);
            pendingRedirect = redirectUrl;
            authModal.show();
        }

        function showAuthTab(tab) {
            const loginTab = document.getElementById('loginTabBtn');
            const registerTab = document.getElementById('registerTabBtn');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const title = document.getElementById('authModalLabel');
            const alertBox = document.getElementById('authAlert');
            alertBox.classList.add('d-none');

            if (tab === 'register') {
                loginForm.classList.add('d-none');
                registerForm.classList.remove('d-none');
                loginTab.className = 'btn btn-sm btn-outline-gold';
                registerTab.className = 'btn btn-sm btn-gold';
                title.textContent = 'Регистрация';
            } else {
                loginForm.classList.remove('d-none');
                registerForm.classList.add('d-none');
                loginTab.className = 'btn btn-sm btn-gold';
                registerTab.className = 'btn btn-sm btn-outline-gold';
                title.textContent = 'Вход';
            }
        }

        function showAlert(message, type) {
            const box = document.getElementById('authAlert');
            box.className = `alert alert-${type} py-2 small`;
            box.textContent = message;
            box.classList.remove('d-none');
        }

        async function submitLogin(event) {
            event.preventDefault();
            const payload = {
                username: document.getElementById('loginUsername').value,
                password: document.getElementById('loginPassword').value,
            };
            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    credentials: 'same-origin',
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showAlert(data.detail || 'Ошибка входа', 'danger');
                    return;
                }
                showAlert('Вход выполнен!', 'success');
                setTimeout(() => {
                    if (pendingRedirect) {
                        window.location.href = pendingRedirect;
                    } else {
                        window.location.reload();
                    }
                }, 700);
            } catch {
                showAlert('Ошибка соединения', 'danger');
            }
        }

        async function submitRegister(event) {
            event.preventDefault();
            const payload = {
                username: document.getElementById('registerUsername').value,
                email: document.getElementById('registerEmail').value,
                password: document.getElementById('registerPassword').value,
            };
            try {
                const resp = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    credentials: 'same-origin',
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showAlert(data.detail || 'Ошибка', 'danger');
                    return;
                }
                showAlert('Регистрация успешна! Теперь войдите.', 'success');
                showAuthTab('login');
            } catch {
                showAlert('Ошибка соединения', 'danger');
            }
        }

        // Обработка кликов по пунктам меню, требующим авторизации
        document.querySelectorAll('[data-auth-required="true"]').forEach(link => {
            link.addEventListener('click', (e) => {
                const targetUrl = link.getAttribute('data-url');
                if (isAuthenticated) {
                    if (targetUrl && targetUrl !== '#') {
                        window.location.href = targetUrl;
                    }
                } else {
                    e.preventDefault();
                    openAuth('login', targetUrl);
                }
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
